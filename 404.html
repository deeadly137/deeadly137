<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Not Found</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/kneedeepincode/fsex-webfont@v1.0.1/fsex300.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            font-family: 'Fixedsys Excelsior 3.01', Consolas, 'Courier New', monospace;
            min-height: 100vh;
            position: relative;
            overflow: hidden;
        }

        .cube-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .cube {
            position: absolute;
            width: 30px;
            height: 30px;
            background-color: #8a2be2;
            opacity: 0.7;
            animation: floatUp 8s linear infinite;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.7;
            }
            90% {
                opacity: 0.7;
            }
            100% {
                transform: translateY(-100px) rotate(360deg);
                opacity: 0;
            }
        }

        /* Wiggle animation for cubes */
        .cube:nth-child(odd) {
            animation-name: floatUpWiggle;
        }

        @keyframes floatUpWiggle {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.7;
            }
            25% {
                transform: translateY(75vh) rotate(90deg) translateX(8px);
            }
            50% {
                transform: translateY(50vh) rotate(180deg) translateX(-8px);
            }
            75% {
                transform: translateY(25vh) rotate(270deg) translateX(8px);
            }
            90% {
                opacity: 0.7;
            }
            100% {
                transform: translateY(-100px) rotate(360deg);
                opacity: 0;
            }
        }

        .password-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .password-label {
            color: white;
            font-size: 1.5em;
            margin-bottom: 20px;
        }

        .password-inputs {
            position: relative;
            display: flex;
            gap: 10px;
        }

        .password-digit {
            width: 50px;
            height: 50px;
            border: 2px solid white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2em;
            color: white;
            background: transparent;
        }

        /* Invisible field that takes the typing; the boxes above only display its digits. */
        .password-capture {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            outline: none;
            background: transparent;
            opacity: 0;
            cursor: text;
            font-size: 16px; /* keeps mobile browsers from zooming in on focus */
        }

        /* Only visible while the code is being typed, so the resting look stays the same. */
        .password-inputs:focus-within .password-digit {
            border-color: #8a2be2;
        }
    </style>
</head>
<body>
    <div class="cube-container" id="cube-container"></div>
    
    <div class="password-container">
        <div class="password-label">Where dreams come true</div>
        <div class="password-inputs">
            <div class="password-digit" id="digit1"></div>
            <div class="password-digit" id="digit2"></div>
            <div class="password-digit" id="digit3"></div>
            <div class="password-digit" id="digit4"></div>
            <input type="text" class="password-capture" id="password-input" maxlength="4" inputmode="numeric"
                   autocomplete="off" spellcheck="false" aria-label="Password">
        </div>
    </div>

    <script>
        const PASSWORD = '1820';
        const passwordInput = document.getElementById('password-input');
        const digitBoxes = document.querySelectorAll('.password-digit');

        const CUBE_COUNT = 60;
        const CUBE_CLEARANCE = 24; // keeps cubes, and their 8px wiggle, clear of the password text

        // Cubes drift up all over the page, but never through the middle where the password sits.
        function generateCubes() {
            const container = document.getElementById('cube-container');
            const passwordArea = document.querySelector('.password-container').getBoundingClientRect();
            const avoidStart = Math.max(passwordArea.left - CUBE_CLEARANCE, 0);
            const avoidEnd = Math.min(passwordArea.right + CUBE_CLEARANCE, window.innerWidth);

            for (let i = 0; i < CUBE_COUNT; i++) {
                const cube = document.createElement('div');
                const size = 20 + Math.random() * 15;
                cube.className = 'cube';
                cube.style.left = randomCubeLeft(size, avoidStart, avoidEnd) + 'px';
                // Negative delay drops each cube partway into its loop, so the page opens with
                // cubes spread along the whole path instead of piled up at the top edge.
                cube.style.animationDelay = -Math.random() * 8 + 's';
                cube.style.width = size + 'px';
                cube.style.height = size + 'px';
                container.appendChild(cube);
            }
        }

        // Picks a left offset clear of the middle band, spreading cubes over both sides
        // in proportion to how much room each side has.
        function randomCubeLeft(size, avoidStart, avoidEnd) {
            const leftSpan = Math.max(avoidStart - size, 0);
            const rightSpan = Math.max(window.innerWidth - size - avoidEnd, 0);
            const totalSpan = leftSpan + rightSpan;

            // Tiny screens: the password text covers the whole width, so fall back to full width.
            if (totalSpan <= 0) {
                return Math.random() * Math.max(window.innerWidth - size, 0);
            }

            const offset = Math.random() * totalSpan;
            return offset < leftSpan ? offset : avoidEnd + (offset - leftSpan);
        }

        // Check password and redirect if correct
        function checkPassword() {
            if (passwordInput.value === PASSWORD) {
                window.location.href = 'cheese.html';
            }
        }

        // The code is typed in one go, but each character is shown in its own box.
        function renderCode() {
            digitBoxes.forEach((box, index) => {
                box.textContent = passwordInput.value[index] || '';
            });
        }

        passwordInput.addEventListener('input', function () {
            // Digits only, never longer than the code; this also makes pasting work.
            passwordInput.value = passwordInput.value.replace(/\D/g, '').slice(0, PASSWORD.length);
            renderCode();
            checkPassword();
        });

        // Focus the field up front so the code can be typed without clicking a box first.
        passwordInput.focus();

        generateCubes();
    </script>
</body>
</html>
