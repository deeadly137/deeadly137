<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Decidueye</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* The game stage fills the viewport and nothing on this page scrolls. */
        body {
            overflow: hidden;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }

        /* Fullscreen menu layer; `.hidden` is ready for when Play takes over the screen. */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            z-index: 30;
        }

        .overlay.hidden {
            display: none;
        }

        .menu-buttons {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
        }

        .menu-btn {
            min-width: 220px;
            padding: 12px 28px;
            font-family: 'Fixedsys Excelsior 3.01', Consolas, 'Courier New', monospace;
            font-size: 1.2em;
            background-color: #ecf0f1;
            border: 4px solid #bdc3c7;
            color: #2c3e50;
            cursor: pointer;
        }

        .menu-btn:hover {
            border-color: #e74c3c;
        }

        .menu-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>
    <!-- Fullscreen stage for the point & click minigame; the game itself will live in here. -->
    <div id="game-container"></div>

    <div id="menu-overlay" class="overlay">
        <h1>GAME GAME GAME</h1>
        <div class="menu-buttons">
            <button id="play-btn" class="menu-btn">Play</button>
            <button id="options-btn" class="menu-btn">Options</button>
            <button id="back-btn" class="menu-btn">Back</button>
        </div>
    </div>

    <script>
        // Back leaves the game and returns to wherever the player came from, falling back to
        // the hub page when this page was opened on its own.
        function goBack() {
            if (window.history.length > 1) {
                window.history.back();
            } else {
                window.location.href = 'index.html';
            }
        }

        document.getElementById('back-btn').addEventListener('click', goBack);

        // Play and Options are intentionally inert for now: the minigame and the options
        // screen will be wired to those buttons once they exist.
    </script>
</body>
</html>
