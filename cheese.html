<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cheese Minigame</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/kneedeepincode/fsex-webfont@v1.0.1/fsex300.css">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            font-family: 'Fixedsys Excelsior 3.01', Consolas, 'Courier New', monospace;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        .top-image {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            pointer-events: none;
        }

        .top-image img {
            max-width: 300px;
            width: 100%;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100vh;
        }

        #player {
            position: absolute;
            bottom: 20px;
            width: 68px;
            height: 68px;
            background-image: url('assets/special/ratidle.gif');
            background-size: contain;
            background-repeat: no-repeat;
            z-index: 5;
        }

        /* The rat sprites are drawn facing left, so walking right mirrors them. */
        #player.facing-right {
            transform: scaleX(-1);
        }

        .star {
            position: absolute;
            width: 36px;
            height: 36px;
            background-size: contain;
            background-repeat: no-repeat;
            z-index: 4;
        }

        .star1 { background-image: url('assets/special/star1.png'); }
        .star2 { background-image: url('assets/special/star2.png'); }
        .star3 { background-image: url('assets/special/star3.png'); }
        .star4 { background-image: url('assets/special/star4.png'); }

        /* HUD */
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            color: #fff;
            font-size: 1.3em;
            text-shadow: 2px 2px 0 #000;
            z-index: 20;
            pointer-events: none;
        }

        #lives {
            letter-spacing: 4px;
        }

        /* Overlays (start screen / game over) */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            z-index: 30;
            padding: 20px;
        }

        .overlay.hidden {
            display: none;
        }

        .overlay h1 {
            font-size: 2.2em;
            margin: 0 0 10px 0;
        }

        .overlay p {
            font-size: 1.1em;
            margin: 6px 0;
            max-width: 480px;
            line-height: 1.5;
        }

        .overlay .score-line {
            font-size: 1.4em;
            margin: 16px 0;
        }

        .overlay button {
            margin-top: 20px;
            padding: 12px 28px;
            font-family: 'Fixedsys Excelsior 3.01', Consolas, 'Courier New', monospace;
            font-size: 1.1em;
            background-color: #ecf0f1;
            border: 4px solid #bdc3c7;
            color: #2c3e50;
            cursor: pointer;
        }

        .overlay button:hover {
            border-color: #e74c3c;
        }

        .overlay button:active {
            transform: scale(0.95);
        }

        .key {
            display: inline-block;
            border: 2px solid #fff;
            border-radius: 4px;
            padding: 1px 8px;
            margin: 0 2px;
        }
    </style>
</head>
<body>
    <div class="top-image">
        <img src="assets/background/InCaseImakeIt.png" alt="In Case I Make It">
    </div>

    <div id="hud">
        <div id="score">Score: 0</div>
        <div id="lives">♥ ♥ ♥</div>
    </div>

    <div id="game-container">
        <div id="player"></div>
    </div>

    <div id="start-overlay" class="overlay">
        <h1>Cheese Run</h1>
        <p>Catch the falling stars before they hit the ground. Miss three and it's over.</p>
        <p><span class="key">A</span> move left &nbsp; <span class="key">L</span> move right &nbsp; <span class="key">Space</span> dash</p>
        <button id="start-btn">Start</button>
    </div>

    <div id="gameover-overlay" class="overlay hidden">
        <h1>Game Over</h1>
        <p class="score-line" id="final-score">Score: 0</p>
        <p id="high-score-line">Best: 0</p>
        <button id="restart-btn">Play Again</button>
    </div>

    <audio id="bgm" loop>
        <source src="assets/sounds/WhatsForTheBest-Ealu.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

    <script>
        const player = document.getElementById('player');
        const gameContainer = document.getElementById('game-container');
        const scoreEl = document.getElementById('score');
        const livesEl = document.getElementById('lives');
        const startOverlay = document.getElementById('start-overlay');
        const gameoverOverlay = document.getElementById('gameover-overlay');
        const finalScoreEl = document.getElementById('final-score');
        const highScoreLineEl = document.getElementById('high-score-line');
        const startBtn = document.getElementById('start-btn');
        const restartBtn = document.getElementById('restart-btn');
        const bgm = document.getElementById('bgm');

        const PLAYER_WIDTH = 68;
        const STAR_SIZE = 36;
        const START_LIVES = 3;
        const DASH_DURATION_FRAMES = 16; // ~0.25s at the 16ms tick below
        const DASH_COOLDOWN_MS = 2000;
        const PLAYER_SPEED = 5;
        const TICK_MS = 16;

        const HIGH_SCORE_KEY = 'cheeseRunHighScore';

        let playerPos = 0;
        let pressedKeys = new Set();
        let facing = -1; // -1 = left, 1 = right; rat sprites are drawn facing left
        let canDash = true;
        let isDashing = false;
        let dashTimeLeft = 0;
        let dashSpeed = 0;

        let stars = [];
        let score = 0;
        let lives = START_LIVES;
        let gameState = 'start'; // 'start' | 'playing' | 'gameover'
        let elapsed = 0; // ms survived, used for difficulty scaling
        let spawnChance = 0.02;
        let starSpeedMin = 2;
        let starSpeedMax = 5;

        function getHighScore() {
            try {
                return parseInt(localStorage.getItem(HIGH_SCORE_KEY), 10) || 0;
            } catch (e) {
                return 0;
            }
        }

        function setHighScore(value) {
            try {
                localStorage.setItem(HIGH_SCORE_KEY, String(value));
            } catch (e) {
                // localStorage unavailable, ignore silently
            }
        }

        function computeDashSpeed() {
            // Cover ~20% of the screen width over the dash duration.
            return (window.innerWidth * 0.2) / DASH_DURATION_FRAMES;
        }

        function updateHud() {
            scoreEl.textContent = 'Score: ' + score;
            livesEl.textContent = '♥ '.repeat(Math.max(lives, 0)).trim() || '—';
        }

        function resetPlayer() {
            playerPos = window.innerWidth / 2 - PLAYER_WIDTH / 2;
            player.style.left = playerPos + 'px';
            player.style.backgroundImage = "url('assets/special/ratidle.gif')";
            pressedKeys.clear();
            setPlayerFacing(-1); // start unflipped, matching the sprite's natural left-facing pose
            canDash = true;
            isDashing = false;
            dashTimeLeft = 0;
            dashSpeed = computeDashSpeed();
        }

        function clearStars() {
            stars.forEach(star => star.el.remove());
            stars = [];
        }

        function startGame() {
            score = 0;
            lives = START_LIVES;
            elapsed = 0;
            spawnChance = 0.02;
            starSpeedMin = 2;
            starSpeedMax = 5;
            clearStars();
            resetPlayer();
            updateHud();
            gameState = 'playing';
            startOverlay.classList.add('hidden');
            gameoverOverlay.classList.add('hidden');

            bgm.currentTime = 0;
            bgm.play().catch(() => {
                // Some browsers may still block playback; ignore, game works without sound.
            });
        }

        function endGame() {
            gameState = 'gameover';
            const highScore = Math.max(score, getHighScore());
            setHighScore(highScore);
            finalScoreEl.textContent = 'Score: ' + score;
            highScoreLineEl.textContent = 'Best: ' + highScore;
            gameoverOverlay.classList.remove('hidden');
            bgm.pause();
        }

        startBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', startGame);

        // Keyboard controls
        document.addEventListener('keydown', function (e) {
            const key = e.key.toLowerCase();

            if (key === ' ' && gameState !== 'playing') {
                e.preventDefault();
                startGame();
                return;
            }

            if (gameState !== 'playing') return;

            if (key === 'a' || key === 'l') {
                pressedKeys.add(key);
                if (!isDashing) {
                    // A dash keeps the last faced direction, so only turn while walking.
                    setPlayerFacing(key === 'a' ? -1 : 1);
                    player.style.backgroundImage = "url('assets/special/ratwalk.gif')";
                }
            } else if (key === ' ') {
                e.preventDefault();
                if (canDash && !isDashing) {
                    startDash();
                }
            }
        });

        document.addEventListener('keyup', function (e) {
            const key = e.key.toLowerCase();
            if (key === 'a' || key === 'l') {
                pressedKeys.delete(key);
                if (pressedKeys.size === 0 && !isDashing) {
                    player.style.backgroundImage = "url('assets/special/ratidle.gif')";
                }
            }
        });

        function currentMoveDirection() {
            const left = pressedKeys.has('a');
            const right = pressedKeys.has('l');
            if (left && !right) return -1;
            if (right && !left) return 1;
            return 0; // both or neither pressed: no movement
        }

        // Turns the rat to face the given direction (-1 left / 1 right) and mirrors it when
        // walking right, since the sprites are drawn facing left.
        function setPlayerFacing(direction) {
            if (direction === facing) return;
            facing = direction;
            player.classList.toggle('facing-right', direction === 1);
        }

        function startDash() {
            isDashing = true;
            canDash = false;
            dashTimeLeft = DASH_DURATION_FRAMES;
            dashSpeed = computeDashSpeed();
            player.style.backgroundImage = "url('assets/special/ratdash.gif')";
        }

        // Movement loop
        function updatePlayerPosition() {
            let direction = currentMoveDirection();

            if (isDashing) {
                // Dash keeps the direction the rat was last facing.
                playerPos += facing * dashSpeed;
                dashTimeLeft--;

                if (dashTimeLeft <= 0) {
                    isDashing = false;
                    const stillMoving = currentMoveDirection() !== 0;
                    player.style.backgroundImage = stillMoving
                        ? "url('assets/special/ratwalk.gif')"
                        : "url('assets/special/ratidle.gif')";

                    setTimeout(() => {
                        canDash = true;
                    }, DASH_COOLDOWN_MS);
                }
            } else if (direction !== 0) {
                setPlayerFacing(direction);
                playerPos += direction * PLAYER_SPEED;
            }

            if (playerPos < 0) playerPos = 0;
            if (playerPos > window.innerWidth - PLAYER_WIDTH) {
                playerPos = window.innerWidth - PLAYER_WIDTH;
            }

            player.style.left = playerPos + 'px';
        }

        // Falling stars
        const starTypes = ['star1', 'star2', 'star3', 'star4'];

        function createStar() {
            const el = document.createElement('div');
            el.className = 'star ' + starTypes[Math.floor(Math.random() * starTypes.length)];
            const left = Math.random() * (window.innerWidth - STAR_SIZE);
            el.style.left = left + 'px';
            el.style.top = '-' + STAR_SIZE + 'px';
            gameContainer.appendChild(el);

            stars.push({
                el: el,
                left: left,
                top: -STAR_SIZE,
                speed: starSpeedMin + Math.random() * (starSpeedMax - starSpeedMin)
            });
        }

        function rectsOverlap(aLeft, aTop, aRight, aBottom, bLeft, bTop, bRight, bBottom) {
            return aLeft < bRight && aRight > bLeft && aTop < bBottom && aBottom > bTop;
        }

        function updateStars() {
            const playerLeft = playerPos;
            const playerRight = playerPos + PLAYER_WIDTH;
            const playerTop = window.innerHeight - 20 - PLAYER_WIDTH;
            const playerBottom = window.innerHeight - 20;

            // Iterate backwards so removing entries mid-loop never skips a star.
            for (let i = stars.length - 1; i >= 0; i--) {
                const star = stars[i];
                star.top += star.speed;
                star.el.style.top = star.top + 'px';

                const starLeft = star.left;
                const starRight = star.left + STAR_SIZE;
                const starTop = star.top;
                const starBottom = star.top + STAR_SIZE;

                if (rectsOverlap(starLeft, starTop, starRight, starBottom, playerLeft, playerTop, playerRight, playerBottom)) {
                    star.el.remove();
                    stars.splice(i, 1);
                    score += 10;
                    updateHud();
                    continue;
                }

                if (star.top > window.innerHeight) {
                    star.el.remove();
                    stars.splice(i, 1);
                    lives--;
                    updateHud();
                    if (lives <= 0) {
                        endGame();
                        return;
                    }
                }
            }
        }

        function updateDifficulty() {
            elapsed += TICK_MS;
            // Ramp up difficulty every 15s, capped so it never becomes unfair.
            const stage = Math.floor(elapsed / 15000);
            spawnChance = Math.min(0.02 + stage * 0.006, 0.05);
            starSpeedMin = Math.min(2 + stage * 0.4, 5);
            starSpeedMax = Math.min(5 + stage * 0.5, 9);
        }

        // Single persistent game loop; behavior gated by gameState.
        setInterval(() => {
            if (gameState !== 'playing') return;

            updatePlayerPosition();
            updateStars();
            updateDifficulty();
            if (gameState === 'playing' && Math.random() < spawnChance) {
                createStar();
            }
        }, TICK_MS);

        // Keep the player and star bounds sane if the window is resized.
        window.addEventListener('resize', () => {
            if (playerPos > window.innerWidth - PLAYER_WIDTH) {
                playerPos = Math.max(0, window.innerWidth - PLAYER_WIDTH);
                player.style.left = playerPos + 'px';
            }
            dashSpeed = computeDashSpeed();
        });

        // Initial static state before the player presses Start.
        resetPlayer();
        updateHud();
        highScoreLineEl.textContent = 'Best: ' + getHighScore();
    </script>
</body>
</html>
